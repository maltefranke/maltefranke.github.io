<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1055"/>
      <stop offset="1" stop-color="#7a0b78"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#ffb23e"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- message-passing edges to the central node -->
  <g stroke="#f3b6ef" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="32" x2="32" y2="12"/>
    <line x1="32" y1="32" x2="49.3" y2="22"/>
    <line x1="32" y1="32" x2="49.3" y2="42"/>
    <line x1="32" y1="32" x2="32" y2="52"/>
    <line x1="32" y1="32" x2="14.7" y2="42"/>
    <line x1="32" y1="32" x2="14.7" y2="22"/>
  </g>
  <!-- molecular ring -->
  <polygon points="32,12 49.3,22 49.3,42 32,52 14.7,42 14.7,22" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <!-- atoms / neurons -->
  <g fill="#ffffff">
    <circle cx="32" cy="12" r="5"/>
    <circle cx="49.3" cy="22" r="5"/>
    <circle cx="49.3" cy="42" r="5"/>
    <circle cx="32" cy="52" r="5"/>
    <circle cx="14.7" cy="42" r="5"/>
    <circle cx="14.7" cy="22" r="5"/>
  </g>
  <circle cx="32" cy="32" r="7" fill="url(#core)"/>
</svg>
